[package]
name = "transaction-labeller"
version = "0.1.0"
edition = "2021"
description = "Local LLM-based REST service that labels bank transactions with spending/income categories"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
futures = "0.3"
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"